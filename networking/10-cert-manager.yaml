---
# Let's Encrypt ClusterIssuer - Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email để nhận thông báo về certificate expiry
    email: lekhauhuutai48@gmail.com  # THAY EMAIL CỦA BẠN

    # Secret để lưu private key của ACME account
    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    # HTTP-01 challenge để verify domain ownership
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Let's Encrypt ClusterIssuer - Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Let's Encrypt staging server (không giới hạn rate limit)
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    email: lekhauhuutai48@gmail.com  # THAY EMAIL CỦA BẠN

    privateKeySecretRef:
      name: letsencrypt-staging-account-key

    solvers:
    - http01:
        ingress:
          class: nginx