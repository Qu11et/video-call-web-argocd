# =====================================================
# REDIS - Fix Image Pull Error
# =====================================================
redis:
  enabled: true
  
  # Sử dụng image tag mới nhất và stable
  image:
    registry: asia-southeast1-docker.pkg.dev
    repository: helical-chemist-471003-u9/video-call-repo/redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  
  auth:
    enabled:  false
  
  architecture: standalone
  
  master:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    
    persistence: 
      enabled: false

# =====================================================
# MONGODB - Fix Image Pull Error
# =====================================================
mongodb:
  enabled:  true
  
  # Sử dụng image tag mới nhất và stable
  image:
    registry: asia-southeast1-docker.pkg.dev
