# =====================================================
# REDIS - Fix Image Pull Error
# =====================================================
redis:
  enabled: true
  
  # Sử dụng image tag mới nhất và stable
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: 7.4.1-debian-12-r5
    pullPolicy: IfNotPresent
  
  auth:
    enabled:  false
  
  architecture: standalone
  
  master:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    
    persistence: 
      enabled: false

# =====================================================
# MONGODB - Fix Image Pull Error
# =====================================================
mongodb:
  enabled:  true
  
  # Sử dụng image tag mới nhất và stable
  image:
    registry: docker.io
    repository: bitnami/mongodb
    tag: 7.0.14-debian-12-r7
    pullPolicy: IfNotPresent
  
  auth:
    enabled: true
    rootPassword:  "password123"
  
  architecture: standalone
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  
  persistence: 
    enabled: false