# =============================================================================
# DEPLOYMENT: LiveKit Server
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: video-call-prod
spec:
  replicas: 1
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: livekit
  
  template:
    metadata:
      labels:
        app: livekit
    
    spec:
      containers:
        - name: livekit
          # ✅ SỬA: Dùng version stable mới nhất
          image: livekit/livekit-server:v1.9.3
          
          command: ["/livekit-server"]
          args:
            - "--config"
            - "/etc/livekit/livekit.yaml"
          
          # ✅ Environment Variables
          env:
            - name: LIVEKIT_PORT
              value: "7880"
            
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          # -------------------------------------------------------------------------
          # PORTS: Expose tất cả ports
          # -------------------------------------------------------------------------
          ports:
            - name: http
              containerPort: 7880
              protocol: TCP
            
            - name: turn-tcp
              containerPort: 7881
              protocol: TCP
            
            # ✅ UDP Range (Container listen ở 50000-50020)
            - name: rtc-start
              containerPort: 50000
              protocol: UDP
            
            - name: rtc-end
              containerPort: 50020
              protocol: UDP
          
          # -------------------------------------------------------------------------
          # VOLUME MOUNTS
          # -------------------------------------------------------------------------
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          
          # -------------------------------------------------------------------------
          # RESOURCE LIMITS
          # -------------------------------------------------------------------------
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          
          # -------------------------------------------------------------------------
          # HEALTH CHECKS - QUAN TRỌNG
          # -------------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      
      # -------------------------------------------------------------------------
      # VOLUMES
      # -------------------------------------------------------------------------
      volumes:
        - name: config
          configMap:
            name: livekit-config