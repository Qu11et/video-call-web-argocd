# =============================================================================
# CHIẾN LƯỢC: Container listen 50000-50020, expose qua NodePort 30000-30020
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: video-call-prod
data:
  livekit.yaml: |
    port: 7880
    
    # ===================================================================
    # RTC CONFIG - QUAN TRỌNG
    # Container LUÔN listen ở 50000-50020 (không thay đổi)
    # K8s sẽ tự động map sang NodePort 30000-30020
    # ===================================================================
    rtc:
      # ✅ Port range TRONG CONTAINER (không đổi)
      port_range_start: 50000
      port_range_end: 50020
      
      # ✅ TCP Port cho TURN fallback
      tcp_port: 7881
      
      # ✅ Để LiveKit tự detect External IP từ STUN
      use_external_ip: true
      
      # ✅ Thêm STUN servers
      stun_servers:
        - stun.l.google.com:19302
        - stun1.l.google.com:19302
    
    redis:
      address: redis:6379
    
    room:
      auto_create: true
      empty_timeout: 300
      departure_timeout: 20
      max_participants: 50
    
    keys:
      devkey: my_super_secure_secret_key_for_dev_only_123
    
    logging:
      level: debug  # ✅ Tăng lên debug để troubleshoot
      sample: false
      json: false

---
# =============================================================================
# SERVICE: NodePort để expose UDP ra ngoài
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: video-call-prod
  labels:
    app: livekit
spec:
  type: NodePort
  externalTrafficPolicy: Local  # ✅ Giữ nguyên Client IP
  sessionAffinity: ClientIP      # ✅ Sticky sessions
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  
  selector:
    app: livekit
  
  ports:
    # -------------------------------------------------------------------------
    # HTTP API + WebSocket Signaling (Ingress sẽ gọi vào đây)
    # -------------------------------------------------------------------------
    - name: http
      port: 7880
      targetPort: 7880
      protocol: TCP
    
    # -------------------------------------------------------------------------
    # TURN TCP Fallback
    # -------------------------------------------------------------------------
    - name: turn-tcp
      port: 7881
      targetPort: 7881
      nodePort: 30881
      protocol: TCP
    
    # -------------------------------------------------------------------------
    # UDP Media Ports: 50000-50020 (container) → 30000-30020 (node)
    # -------------------------------------------------------------------------
    - name: rtc-50000
      port: 50000
      targetPort: 50000
      nodePort: 30000
      protocol: UDP
    - name: rtc-50001
      port: 50001
      targetPort: 50001
      nodePort: 30001
      protocol: UDP
