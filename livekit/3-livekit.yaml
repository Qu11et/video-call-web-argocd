    # ... Bạn có thể copy paste thêm port nếu cần test nhiều user ...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: video-call-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # KHÔNG CẦN hostNetwork NỮA!
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          command: ["/livekit-server", "--config", "/etc/livekit.yaml"]
          ports:
            - containerPort: 7880
            - containerPort: 7882
              protocol: UDP
            - containerPort: 50000
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
      volumes:
        - name: config
          configMap:
            name: livekit-config