# =============================================================================
# FILE: 3-livekit.yaml
# CHIẾN LƯỢC: SIGNALING QUA INGRESS (WSS) - MEDIA QUA NODEPORT (UDP)
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: video-call-prod
data:
  livekit.yaml: |
    port: 7880
    
    # --- CẤU HÌNH QUAN TRỌNG NHẤT ---
    rtc:
      # Dùng dải port NodePort của K8s (30000-32767)
      port_range_start: 30000
      port_range_end: 30020
      
      # Port UDP chính để quảng bá
      udp_port: 30000
      
      # Port TCP dự phòng
      tcp_port: 30881
      
      # Để LiveKit tự hỏi Google STUN xem "IP Public của tao là gì?"
      use_external_ip: true
      
      stun_servers:
        - stun.l.google.com:19302
        - stun1.l.google.com:19302

    redis:
      address: redis:6379
    
    keys:
      devkey: my_super_secure_secret_key_for_dev_only_123

    logging:
      level: info

---
# SERVICE HỢP NHẤT (Dùng NodePort để mở toang cửa cho UDP)
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: video-call-prod
  # Giữ tên service này là "livekit" hoặc "livekit-tcp" 
  # để Ingress cũ của bạn vẫn trỏ vào đúng
  labels:
    app: livekit
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: livekit
  ports:
    # 1. Cổng Tín hiệu (Ingress gọi vào đây)
    - name: http
      port: 7880
      targetPort: 7880
      protocol: TCP
      
    # 2. Cổng TURN (Dự phòng)
    - name: turn-tcp
      port: 7881
      targetPort: 7881
      nodePort: 30881
      protocol: TCP

    # 3. Cổng VIDEO UDP (Quan trọng nhất - Đi thẳng ra internet)
    # Chúng ta map Port 50000 trong container ra Port 30000 ngoài Node
    - name: rtc-udp-main
      port: 50000
      targetPort: 50000
      nodePort: 30000
      protocol: UDP
      
    - name: rtc-udp-1
      port: 50001
      targetPort: 50001
      nodePort: 30001
      protocol: UDP
    - name: rtc-50002
      port: 50002
      targetPort: 50002
      nodePort: 30002
      protocol: UDP
