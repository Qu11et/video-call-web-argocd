---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: video-call-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.8.0 # Hoặc bản mới nhất
          command: ["/livekit-server", "--config", "/etc/livekit/livekit.yaml"]
          
          # Không cần set EXTERNAL_IP thủ công nữa, STUN sẽ lo việc đó
          ports:
            - containerPort: 7880
            - containerPort: 7881
            - containerPort: 50000
              protocol: UDP
            - containerPort: 50020
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
      volumes:
        - name: config
          configMap:
            name: livekit-config