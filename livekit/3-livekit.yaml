# =============================================================================
# LIVEKIT SERVER - PRODUCTION CONFIG
# Giải pháp triệt để cho ICE Connection Failed
# =============================================================================

# -----------------------------------------------------------------------------
# CONFIGMAP: Cấu hình LiveKit Server
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: video-call-prod
data:
  livekit.yaml: |
    # HTTP API Port
    port: 7880
    
    # ===================================================================
    # RTC CONFIG - QUAN TRỌNG NHẤT
    # ===================================================================
    rtc:
      # UDP Port range cho WebRTC traffic
      port_range_start: 50000
      port_range_end: 50020  # ✅ Tăng lên để hỗ trợ nhiều user hơn
      
      # TCP Port cho TURN (bypass firewall/NAT)
      tcp_port: 7881
      
      # ✅ BẮT BUỘC: Sử dụng External IP từ LoadBalancer
      use_external_ip: true
      
      # ✅ TURN Server Config (giúp bypass NAT/Firewall)
      turn_servers:
        - host: livekit.lkht.id.vn
          port: 7881
          protocol: tcp
      
      # ✅ XÓA dòng ice_lite (không còn support trong v1.7.2)
      # ice_lite: false  # ← XÓA DÒNG NÀY
    
    # ===================================================================
    # REDIS CONFIG
    # ===================================================================
    redis:
      address: redis:6379
    
    # ===================================================================
    # ROOM CONFIG
    # ===================================================================
    room:
      auto_create: true
      empty_timeout: 300
      departure_timeout: 20
      max_participants: 50
    
    # ===================================================================
    # KEYS - API Authentication
    # ===================================================================
    keys:
      devkey: my_super_secure_secret_key_for_dev_only_123
    
    # ===================================================================
    # LOGGING
    # ===================================================================
    logging:
      level: info
      sample: false
      json: false

---
# =============================================================================
# SERVICE 1: UDP TRAFFIC (AUDIO/VIDEO)
# Tạo LoadBalancer với External IP riêng cho UDP
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: livekit-udp
  namespace: video-call-prod
  annotations:
    # ✅ GCP: Giữ nguyên Source IP
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  
  # ✅ QUAN TRỌNG: Giữ nguyên Client IP (không qua proxy)
  externalTrafficPolicy: Local
  
  # ✅ Session Affinity: Cùng client luôn route về cùng pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 giờ
  
  selector:
    app: livekit
  
  ports:
    # -------------------------------------------------------------------------
    # TCP Port 7881: TURN Server (Fallback khi UDP bị chặn)
    # -------------------------------------------------------------------------
    - name: turn-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
    
    # -------------------------------------------------------------------------
    # UDP Ports: WebRTC Media Traffic (50000-50020)
    # -------------------------------------------------------------------------
    - name: rtc-50000
      port: 50000
      targetPort: 50000
      protocol: UDP
    - name: rtc-50001
      port: 50001
      targetPort: 50001
      protocol: UDP
    - name: rtc-50002
      port: 50002
      targetPort: 50002
      protocol: UDP
    - name: rtc-50003
      port: 50003
      targetPort: 50003
      protocol: UDP
    - name: rtc-50004
      port: 50004
      targetPort: 50004
      protocol: UDP
    - name: rtc-50005
      port: 50005
      targetPort: 50005
      protocol: UDP
    - name: rtc-50006
      port: 50006
      targetPort: 50006
      protocol: UDP
    - name: rtc-50007
      port: 50007
      targetPort: 50007
      protocol: UDP
    - name: rtc-50008
      port: 50008
      targetPort: 50008
      protocol: UDP
    - name: rtc-50009
      port: 50009
      targetPort: 50009
      protocol: UDP
    - name: rtc-50010
      port: 50010
      targetPort: 50010
      protocol: UDP
    - name: rtc-50011
      port: 50011
      targetPort: 50011
      protocol: UDP
    - name: rtc-50012
      port: 50012
      targetPort: 50012
      protocol: UDP
    - name: rtc-50013
      port: 50013
      targetPort: 50013
      protocol: UDP
    - name: rtc-50014
      port: 50014
      targetPort: 50014
      protocol: UDP
    - name: rtc-50015
      port: 50015
      targetPort: 50015
      protocol: UDP
    - name: rtc-50016
      port: 50016
      targetPort: 50016
      protocol: UDP
    - name: rtc-50017
      port: 50017
      targetPort: 50017
      protocol: UDP
    - name: rtc-50018
      port: 50018
      targetPort: 50018
      protocol: UDP
    - name: rtc-50019
      port: 50019
      targetPort: 50019
      protocol: UDP
    - name: rtc-50020
      port: 50020
      targetPort: 50020
      protocol: UDP

---
# =============================================================================
# SERVICE 2: TCP TRAFFIC (HTTP API + SIGNALING)
# Tạo LoadBalancer với External IP riêng cho TCP
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: livekit-tcp
  namespace: video-call-prod
  annotations:
    # ✅ GCP: Enable HTTP/2 cho WebSocket
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  
  selector:
    app: livekit
  
  ports:
    # HTTP API + WebSocket Signaling
    - name: http
      port: 7880
      targetPort: 7880
      protocol: TCP

---
# =============================================================================
# DEPLOYMENT: LiveKit Server
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: video-call-prod
spec:
  replicas: 1  # ✅ Chỉ chạy 1 replica (để tránh load balancing phức tạp)
  
  # ✅ Rolling Update Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: livekit
  
  template:
    metadata:
      labels:
        app: livekit
    
    spec:
      # ✅ Đảm bảo Pod luôn schedule lại trên cùng node (nếu có thể)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - livekit
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.7.2  # ✅ Pin version để tránh breaking changes
          
          # ✅ Start command với config file
          command: ["/livekit-server"]
          args:
            - "--config"
            - "/etc/livekit/livekit.yaml"
            - "--node-ip"  # ✅ Tự động detect External IP
            - "$(POD_IP)"
          
          # ✅ Environment Variables
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            
            - name: LIVEKIT_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          # -------------------------------------------------------------------------
          # PORTS: Expose tất cả ports cần thiết
          # -------------------------------------------------------------------------
          ports:
            # HTTP API
            - name: http
              containerPort: 7880
              protocol: TCP
            
            # TURN TCP
            - name: turn-tcp
              containerPort: 7881
              protocol: TCP
            
            # WebRTC UDP Range
            - name: rtc-start
              containerPort: 50000
              protocol: UDP
            - name: rtc-end
              containerPort: 50020
              protocol: UDP
          
          # -------------------------------------------------------------------------
          # VOLUME MOUNTS
          # -------------------------------------------------------------------------
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          
          # -------------------------------------------------------------------------
          # RESOURCE LIMITS
          # -------------------------------------------------------------------------
          resources:
            requests:
              cpu: "500m"      # 0.5 CPU
              memory: "512Mi"
            limits:
              cpu: "2000m"     # 2 CPU
              memory: "2Gi"
          
          # -------------------------------------------------------------------------
          # HEALTH CHECKS
          # -------------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      
      # -------------------------------------------------------------------------
      # VOLUMES
      # -------------------------------------------------------------------------
      volumes:
        - name: config
          configMap:
            name: livekit-config
            items:
              - key: livekit.yaml
                path: livekit.yaml

---
