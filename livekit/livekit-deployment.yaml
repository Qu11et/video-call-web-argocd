apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # --- QUAN TRỌNG NHẤT: Dùng mạng trực tiếp của Node ---
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # Để LiveKit vẫn gọi được Redis nội bộ qua DNS
      # -----------------------------------------------------
      enableServiceLinks: false
      
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.8.0 # Hoặc bản mới nhất
          command: ["/livekit-server"]
          args: ["--config", "/etc/livekit.yaml"]
          
          # Cấu hình biến môi trường (Ghi đè file config)
          env:
            # 1. API Keys (Định dạng: Key:Secret)
            - name: LIVEKIT_KEYS
              value: "devkey:secret"
            
            # 2. Cấu hình Redis (Kết nối tới Redis tự tạo của bạn)
            - name: LIVEKIT_REDIS_ADDRESS
              value: "redis.video-call-prod.svc.cluster.local:6379"
            - name: LIVEKIT_REDIS_PASSWORD
              value: "password123"
            
            # 3. IP Node (Tự động lấy IP của Node hiện tại gán vào config)
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Ép LiveKit dùng IP này để quảng bá cho Client
            - name: LIVEKIT_RTC_NODE_IP_MAP 
              value: "$(NODE_IP)" 

          ports:
            - containerPort: 7880
              protocol: TCP
            # Không cần liệt kê UDP port ở đây vì dùng hostNetwork nó tự mở hết
          
          volumeMounts:
            - name: livekit-config-volume
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml

      volumes:
        - name: livekit-config-volume
          configMap:
            name: livekit-config