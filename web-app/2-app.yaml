# 2-app.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: video-call-prod
data:
  # Cấu hình Spring Boot đã được chỉnh sửa cho K8s
  application.properties: |
    spring.application.name=video-call-web-app

    server.port=8080

    springdoc.swagger-ui.title=Video Call API Documentation
    springdoc.swagger-ui.path=/swagger-ui.html
    springdoc.api-docs.path=/v3/api-docs

    springdoc.info.title=Video Call API
    springdoc.info.version=v1.0.0
    springdoc.info.description=Tài liệu REST API cho ứng dụng Video Call (Backend)

    server.forward-headers-strategy=framework

    # --- CẤU HÌNH DATABASE (PostgreSQL) ---
    # Format: jdbc:postgresql://<host>:<port>/<tên_db>
    spring.datasource.url=jdbc:postgresql://postgres-cluster.postgres-operator.svc.cluster.local:5432/video_call_db
    spring.datasource.driver-class-name=org.postgresql.Driver

    # Tự động tạo index (để tìm kiếm nhanh)
    spring.data.mongodb.auto-index-creation=true

    # --- JPA / HIBERNATE CONFIG ---
    # Tự động cập nhật schema database khi chạy app (create/update/none)
    spring.jpa.hibernate.ddl-auto=update
    # Hiển thị câu lệnh SQL trong log để dễ debug
    spring.jpa.show-sql=true
    # Dialect giúp Hibernate tạo câu SQL chuẩn cho PostgreSQL
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

    # --- JWT CONFIG (Giữ nguyên) ---
    # Thời gian hết hạn Access Token (1 ngày = 86400000 ms)
    application.security.jwt.expiration=86400000
    # Thời gian hết hạn Refresh Token (7 ngày)
    application.security.jwt.refresh-token.expiration=604800000

    # --- COOKIE CONFIG (Lưu Token an toàn) ---
    application.cookie.domain=lkht.id.vn
    application.cookie.secure=true
    application.cookie.http-only=true
    application.cookie.max-age=86400
    application.cookie.same-site=None
    application.cookie.path=/

    # --- LIVEKIT CONFIG ---
    livekit.url=wss://livekit.lkht.id.vn

    # --- CẤU HÌNH REDIS ---
    spring.data.redis.host=redis
    spring.data.redis.port=6379

    # --- CẤU HÌNH EMAIL (Gmail SMTP) ---
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: video-call-prod
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: video-call-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Thay bằng Image Backend của bạn
          image: asia-southeast1-docker.pkg.dev/helical-chemist-471003-u9/video-call-repo/video-call-backend:77e9d6d
          ports:
            - containerPort: 8080
          env:
            # JWT Secret
            - name: APPLICATION_SECURITY_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: JWT_SECRET_KEY
            # Database credentials
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: DB_PASSWORD
            # MongoDB URI
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: MONGO_URI
            # Email credentials
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: EMAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: EMAIL_PASSWORD
            # LiveKit credentials
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: video-call-secrets
                  key: LIVEKIT_API_SECRET
            # Load config từ ConfigMap
            - name: SPRING_CONFIG_LOCATION
              value: file:/app/config/application.properties
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              #subPath: application.properties
      volumes:
        - name: config-volume
          configMap:
            name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: video-call-prod
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: video-call-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Thay bằng Image Frontend của bạn
          image: asia-southeast1-docker.pkg.dev/helical-chemist-471003-u9/video-call-repo/video-call-frontend:66c2000
          ports:
            - containerPort: 80
