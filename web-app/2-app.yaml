# 2-app.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: video-call-prod
data:
  # Cấu hình Spring Boot đã được chỉnh sửa cho K8s
  application.properties: |
    server.port=8080
    spring.datasource.url=jdbc:postgresql://postgres:5432/video_call_db
    spring.datasource.username=postgres
    spring.datasource.password=123456
    spring.data.mongodb.uri=mongodb://root:password123@mongo:27017/meeting_history_db?authSource=admin
    spring.data.redis.host=redis
    spring.data.redis.port=6379
    # Chúng ta sẽ cấu hình LiveKit URL sau khi có IP LoadBalancer
    livekit.url=ws://34.80.190.105:7880
    livekit.api.key=devkey
    livekit.api.secret=my_super_secure_secret_key_for_dev_only_123

    spring.application.name=video-call-web-app

    # --- JPA / HIBERNATE CONFIG ---
    # Tự động cập nhật schema database khi chạy app (create/update/none)
    spring.jpa.hibernate.ddl-auto=update
    # Hiển thị câu lệnh SQL trong log để dễ debug
    spring.jpa.show-sql=true
    # Dialect giúp Hibernate tạo câu SQL chuẩn cho PostgreSQL
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

    # --- JWT CONFIG (Giữ nguyên) ---
    application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    # Thời gian hết hạn Access Token (1 ngày = 86400000 ms)
    application.security.jwt.expiration=86400000
    # Thời gian hết hạn Refresh Token (7 ngày)
    application.security.jwt.refresh-token.expiration=604800000

    # --- SERVER CONFIG ---
    server.forward-headers-strategy=framework

    # --- COOKIE CONFIG (Lưu Token an toàn) ---
    # Domain của cookie: Đặt là tên miền của bạn để cookie hoạt động trên https://lkht.id.vn
    application.cookie.domain=lkht.id.vn
    # Secure: true (chỉ gửi qua HTTPS). Nếu test localhost thì để false, nhưng lên VPS nên là true.
    # Tuy nhiên, do Nginx xử lý SSL và chuyển vào trong là HTTP, đôi khi để false an toàn hơn để tránh lỗi logic nội bộ
    application.cookie.secure=false
    application.cookie.http-only=true
    application.cookie.max-age=86400

    # --- CẤU HÌNH REDIS ---
    spring.data.redis.host=redis
    spring.data.redis.port=6379

    # --- CẤU HÌNH EMAIL (Gmail SMTP) ---
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=khautyler@gmail.com
    # Lưu ý: Đây là App Password (không phải pass đăng nhập gmail), bạn phải tạo trong Google Account Security
    spring.mail.password=rcmvqygmtbthlotz
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: video-call-prod
spec:
  type: ClusterIP  
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: video-call-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Thay bằng Image Backend của bạn
          image: asia-southeast1-docker.pkg.dev/helical-chemist-471003-u9/video-call-repo/video-call-backend:4281ca3 
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.properties
              subPath: application.properties
      volumes:
        - name: config-volume
          configMap:
            name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: video-call-prod
spec:
  type: ClusterIP  
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: video-call-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Thay bằng Image Frontend của bạn
          image: asia-southeast1-docker.pkg.dev/helical-chemist-471003-u9/video-call-repo/video-call-frontend:260115
          ports:
            - containerPort: 80