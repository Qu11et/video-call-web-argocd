apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-call-ingress
  namespace: video-call-prod
  annotations:
    # ✅ 1. Yêu cầu Cert-Manager cấp SSL tự động
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # ✅ 2. Tự động chuyển HTTP → HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # ✅ 3. Tăng giới hạn upload
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # ✅ 4. CẤU HÌNH WEBSOCKET
    # Chỉ cần timeout, KHÔNG CẦN snippet chỉnh header
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    
    # Chỉ định service dùng WebSocket
    nginx.ingress.kubernetes.io/websocket-services: "backend,livekit-tcp"
    
    # ✅ 5. CORS (Nếu Backend Spring Boot đã cấu hình CORS thì có thể bỏ đoạn này)
    # Nhưng để ở đây cũng được nếu bạn muốn Nginx chặn trước
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lkht.id.vn, https://livekit.lkht.id.vn"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"

    # ❌ ĐÃ XÓA configuration-snippet GÂY LỖI

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lkht.id.vn
        - livekit.lkht.id.vn
      secretName: video-call-tls-secret
  
  rules:
    # ============================================
    # Rule 1: Web App chính
    # ============================================
    - host: lkht.id.vn
      http:
        paths:
          # WebSocket P2P
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          # API Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          # Swagger UI
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          # Frontend React
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # ============================================
    # Rule 2: LiveKit Server
    # ============================================
    - host: livekit.lkht.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-tcp
                port:
                  number: 7880