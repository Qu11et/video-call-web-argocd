apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-call-ingress
  namespace: video-call-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # ✅ WebSocket config
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "backend,livekit-tcp"
    
    # ✅ CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lkht.id.vn, https://livekit.lkht.id.vn"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # ✅ WebSocket headers
    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lkht.id.vn
        - livekit.lkht.id.vn
      secretName: video-call-tls-secret
  
  rules:
    - host: lkht.id.vn
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    - host: livekit.lkht.id.vn
      http:
        paths:
          # ✅ THÊM: Route tất cả /rtc/* về LiveKit
          - path: /rtc
            pathType: Prefix
            backend:
              service:
                name: livekit-tcp
                port:
                  number: 7880
          
          # ✅ THÊM: WebSocket signaling
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: livekit-tcp
                port:
                  number: 7880
          
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-tcp
                port:
                  number: 7880