# web-app/4-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-call-ingress
  namespace: video-call-prod
  annotations:
    # 1. Chỉ định dùng Nginx Controller
    kubernetes.io/ingress.class: nginx
    
    # 2. Yêu cầu Cert-Manager cấp chứng chỉ SSL tự động
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # 3. Tự động chuyển HTTP sang HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # 4. Tăng giới hạn upload (quan trọng nếu upload file/ảnh)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # --- CẤU HÌNH QUAN TRỌNG CHO WEBSOCKET ---
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "livekit-tcp"

spec:
  # Cấu hình TLS (HTTPS)
  tls:
    - hosts:
        - lkht.id.vn
        - livekit.lkht.id.vn   
      secretName: video-call-tls-secret # Cert-manager sẽ lưu chứng chỉ vào đây
  rules:
    # Rule 1: Cho Web App (Giữ nguyên)
    - host: lkht.id.vn
      http:
        paths:
          # API Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # WebSocket
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Frontend React
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # Rule 2: Cho LiveKit Signaling (MỚI)
    - host: livekit.lkht.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-tcp # Trỏ vào Service TCP cũ của LiveKit
                port:
                  number: 7880              